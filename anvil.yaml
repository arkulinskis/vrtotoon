metadata:
  description: 'Make 3D cartoons in your browser: perform every character yourself in a VR headset or with the mouse, direct
    on your computer, export video or Blender files.'
  logo_img: asset:icon-512.png
  title: 'VRtoToon: make cartoons in VR, playing every role yourself'
name: VRtoToon
native_deps:
  head_html: |
    <script src="_/theme/legal-kit.js?v=a29b3d6df2"></script>
    <!-- seo:start (APP_MAKER/seo: edit seo/apps/vrtotoon.json and run seo.py, not here) -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="keywords" content="vr motion capture cartoon, make cartoons in vr, flipside xr alternative, webxr animation, vr animation studio browser, one person animation multiple characters, quest motion capture, 3d cartoon maker online, export animation to blender, vtuber style puppeteering">
    <meta name="author" content="Arkvital">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="VRtoToon">
    <meta property="og:title" content="VRtoToon: make cartoons in VR, playing every role yourself">
    <meta property="og:description" content="Make 3D cartoons in your browser: perform every character yourself in a VR headset or with the mouse, direct on your computer, export video or Blender files.">
    <meta property="og:locale" content="en_CA">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="VRtoToon: make cartoons in VR, playing every role yourself">
    <meta name="twitter:description" content="Make 3D cartoons in your browser: perform every character yourself in a VR headset or with the mouse, direct on your computer, export video or Blender files.">
    <!-- seo:end -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#120b0d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:ital,wght@0,600;1,500;1,600&display=swap" rel="stylesheet">
    <link id="ui-favicon" rel="icon" type="image/svg+xml" href="_/theme/icon.svg?v=9d986f8498">
    <link rel="apple-touch-icon" href="_/theme/icon-180.png?v=9a3a358dc2">
    <script>
    /* Keep our tab icon: Anvil adds its own <link rel="icon">, so drop any other icon link. */
    (function () {
      function keep() {
        var ours = document.getElementById('ui-favicon');
        if (!ours) return;
        document.querySelectorAll('link[rel~="icon"]').forEach(function (l) { if (l !== ours) l.remove(); });
      }
      keep();
      document.addEventListener('DOMContentLoaded', keep);
      window.addEventListener('load', keep);
    })();
    </script>

    <!-- Prepsto feedback panel: every "Submit feedback" link and button opens it (it is the only feedback channel). No floating button, no cookies, nothing loads until it is opened. Codes: APP_MAKER/prepsto-links.json -->
    <script src="https://prepsto.com/_/theme/widget.js" data-prepsto="nmbrrdm" data-button="false" data-label="Submit feedback" async></script>
    <link rel="stylesheet" href="_/theme/icons.css?v=c408c1671b">
    <link rel="stylesheet" href="_/theme/app.css?v=5dc018e22c">
    <link rel="stylesheet" href="_/theme/vt.css?v=95efa549ae">
    <script src="_/theme/app-kit.js?v=3240841489"></script>
    <script src="_/theme/three.min.js?v=3bfa54fdd7"></script>
    <script src="_/theme/vt-cast.js?v=0f6ec7f5fd"></script>
    <script src="_/theme/vt-sets.js?v=07f964753b"></script>
    <script src="_/theme/vt-film.js?v=fe704b4faa"></script>
    <script src="_/theme/vt-stage.js?v=2785bb159b"></script>
    <script src="_/theme/vt-timeline.js?v=e75e34b3a3"></script>
    <script src="_/theme/vt-xr.js?v=e1ab1e1e62"></script>
    <script src="_/theme/vt-live.js?v=399965585f"></script>
    <script src="_/theme/vt-export.js?v=0ff5d0f7b1"></script>
    <script src="_/theme/vt-ui.js?v=c82db9b28a"></script>
    <script src="_/theme/vt-ed.js?v=c2447d3baf"></script>
package_name: VRtoToon
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
services:
- client_config:
    enable_v2: true
  server_config: {}
  source: /runtime/services/tables.yml
- client_config:
    allow_remember_me: true
    allow_signup: true
    confirm_email: false
    enable_automatically: true
    remember_me_days: 30
    require_secure_passwords: true
    use_email: true
    use_google: true
  server_config:
    user_table: users
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/google.yml
startup:
  module: startup
  type: module
