<div class="ui wardrobe">
  <div class="cs-grid">
    <div class="cs-stage">
      <anvil-component type="VRtoToon.Components.Turntable" name="turntable"></anvil-component>
      <span class="cs-hint">Drag to turn</span>
    </div>
    <div class="cs-side">
      <anvil-component type="Label" name="base_label" prop:role='["eyebrow-label"]'></anvil-component>
      <h2 class="dlg-h">The wardrobe</h2>
      <div class="ui-stack wd-form">
        <label class="ui-field"><span>Name</span><anvil-component type="TextBox" name="name_box" prop:placeholder="Max Noir"></anvil-component></label>
        <div class="wd-grid">
          <label class="ui-field"><span>Skin / fur</span><anvil-component type="DropDown" name="skin_dd"></anvil-component></label>
          <label class="ui-field"><span>Top</span><anvil-component type="DropDown" name="shirt_dd"></anvil-component></label>
          <label class="ui-field"><span>Trousers</span><anvil-component type="DropDown" name="pants_dd"></anvil-component></label>
          <label class="ui-field"><span>Shoes</span><anvil-component type="DropDown" name="shoes_dd"></anvil-component></label>
          <label class="ui-field"><span>Accent</span><anvil-component type="DropDown" name="accent_dd"></anvil-component></label>
          <label class="ui-field"><span>Hair colour</span><anvil-component type="DropDown" name="haircol_dd"></anvil-component></label>
          <label class="ui-field"><span>Hair</span><anvil-component type="DropDown" name="hair_dd"></anvil-component></label>
          <label class="ui-field"><span>Hat</span><anvil-component type="DropDown" name="hat_dd"></anvil-component></label>
          <label class="ui-field"><span>Height</span><anvil-component type="DropDown" name="height_dd"></anvil-component></label>
          <label class="ui-field"><span>Build</span><anvil-component type="DropDown" name="build_dd"></anvil-component></label>
        </div>
        <div><b class="small">Accessories</b>
          <anvil-component type="RepeatingPanel" name="acc_panel" prop:item_template="VRtoToon.Items.Chip" prop:role='["chip-row", "chip-wrap"]'></anvil-component>
        </div>
        <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
        <div class="ui-row end">
          <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
          <anvil-component type="Button" name="save_button" prop:text="Hang it in the wardrobe" prop:role='["btn", "btn-primary", "ic-check"]'></anvil-component>
        </div>
      </div>
    </div>
  </div>
</div>
